---
layout: default
---
<article class="post">
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
</article>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.layout == 'post' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      {% if site.disclaimer %}<p class="site-disclaimer">{{ site.disclaimer }}</p>{% endif %}
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap"></div>
  </footer>

  <!-- Analytics: GoatCounter (privacy-friendly, cookieless; skips localhost automatically) -->
  <script data-goatcounter="https://rulox.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>

title: Rebuilding Lineage 2 (Interlude) in Godot
description: Notes on rebuilding Lineage 2's world in Godot 4.
disclaimer: Built with a lot of help from AI, mostly for the asset extraction and the scripts.
future: true

# GitHub Pages project site lives under /<repo-name>/
baseurl: "/l2-godot-blog"
url: "https://rulox.github.io"

# Posts are a "parts" collection so files can be named by number (1.md, 2.md, ...).
# Ordering and next-part links use the `part` front matter field.
collections:
  parts:
    output: true

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
